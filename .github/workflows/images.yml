name: Images

# Builds the server images on every merge to main and publishes them to GitHub's container registry.
# The server pulls them (deploy/docker-compose.yml), so it never has to build anything itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  publish:
    # An ARM runner builds the ARM images the Oracle server needs natively (free for public repositories).
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/lauta136/podcast-generator-${{ matrix.image }}:latest
            ghcr.io/lauta136/podcast-generator-${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
